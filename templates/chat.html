    <!-- Chat Area -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Contacts List -->
        <div class="w-80 bg-white border-r flex flex-col shrink-0">
            <div class="p-4 border-b">
                <div class="relative">
                    <input type="text" x-model="search" placeholder="Search conversations..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
                </div>
            </div>
            <div class="flex border-b text-sm">
                <button @click="tab = 'contacts'" :class="tab === 'contacts' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'" class="flex-1 py-2.5 font-medium">Contacts</button>
                <button @click="tab = 'groups'" :class="tab === 'groups' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'" class="flex-1 py-2.5 font-medium">Groups</button>
            </div>
            <div class="flex-1 overflow-y-auto" wire:poll.5s>
                <template x-for="contact in filteredContacts" :key="contact.id">
                    <div @click="selectContact(contact)" :class="selected?.id === contact.id ? 'bg-blue-50' : 'hover:bg-gray-50'" class="flex items-center gap-3 px-4 py-3 cursor-pointer border-b border-gray-50">
                        <div class="relative shrink-0">
                            <div :class="contact.color" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold" x-text="contact.initials"></div>
                            <span :class="contact.online ? 'bg-green-500' : 'bg-gray-400'" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 border-2 border-white rounded-full"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-gray-800 text-sm truncate" x-text="contact.name"></span>
                                <span class="text-xs text-gray-400 shrink-0 ml-2" x-text="contact.time"></span>
                            </div>
                            <p class="text-xs text-gray-500 truncate" x-text="contact.lastMsg"></p>
                        </div>
                        <template x-if="contact.unread">
                            <span class="w-5 h-5 bg-blue-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center shrink-0" x-text="contact.unread"></span>
                        </template>
                    </div>
                </template>
                <div x-show="filteredContacts.length === 0" class="p-8 text-center text-gray-400 text-sm">
                    <i class="fas fa-search text-2xl mb-2 block"></i>
                    No conversations found
                </div>
            </div>
        </div>

        <!-- Active Chat / Empty State -->
        <template x-if="!selected">
            <div class="flex-1 flex items-center justify-center bg-gray-50">
                <div class="text-center text-gray-400">
                    <i class="fas fa-comment-dots text-6xl mb-4"></i>
                    <h3 class="text-xl font-semibold text-gray-500 mb-1">CRM Chat</h3>
                    <p class="text-sm">Select a contact to start messaging</p>
                </div>
            </div>
        </template>

        <template x-if="selected">
            <div class="flex-1 flex flex-col">
                <!-- Chat Header -->
                <div class="bg-white px-6 py-4 border-b flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-3">
                        <div :class="selected.color" class="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold" x-text="selected.initials"></div>
                        <div>
                            <h2 class="font-semibold text-gray-800" x-text="selected.name"></h2>
                            <p class="text-xs" :class="selected.online ? 'text-green-600' : 'text-gray-400'">
                                <i class="fas fa-circle text-[8px] mr-1"></i>
                                <span x-text="selected.online ? 'Online' : 'Last seen ' + selected.time"></span>
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-gray-400">
                        <button class="hover:text-blue-600" title="Voice call"><i class="fas fa-phone"></i></button>
                        <button class="hover:text-blue-600" title="Video call"><i class="fas fa-video"></i></button>
                        <button class="hover:text-blue-600" title="View profile"><i class="fas fa-info-circle"></i></button>
                    </div>
                </div>

                <!-- Messages -->
                <div class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50" x-ref="messagesContainer">
                    <template x-for="(msg, i) in messages" :key="i">
                        <div :class="msg.sent ? 'justify-end' : 'justify-start'" class="flex">
                            <template x-if="!msg.sent">
                                <div class="flex items-end gap-2">
                                    <div :class="selected.color" class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 mb-0.5" x-text="selected.initials"></div>
                                    <div class="max-w-md bg-white rounded-lg rounded-bl-none px-4 py-3 shadow-sm">
                                        <p class="text-sm text-gray-800" x-text="msg.text"></p>
                                        <span class="text-xs text-gray-400 mt-1 block" x-text="msg.time"></span>
                                    </div>
                                </div>
                            </template>
                            <template x-if="msg.sent">
                                <div class="max-w-md bg-blue-600 rounded-lg rounded-br-none px-4 py-3 shadow-sm">
                                    <p class="text-sm text-white" x-text="msg.text"></p>
                                    <div class="flex items-center gap-1 mt-1">
                                        <span class="text-xs text-blue-200" x-text="msg.time"></span>
                                        <i :class="msg.read ? 'text-blue-200' : 'text-blue-300'" class="fas fa-check-double text-[10px]"></i>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Typing indicator -->
                    <div x-show="typing" class="flex justify-start items-end gap-2">
                        <div :class="selected.color" class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[10px] font-bold shrink-0 mb-0.5" x-text="selected.initials"></div>
                        <div class="bg-white rounded-lg rounded-bl-none px-4 py-3 shadow-sm">
                            <div class="flex gap-1">
                                <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
                                <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
                                <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Input -->
                <div class="bg-white px-6 py-4 border-t shrink-0">
                    <form @submit.prevent="sendMessage" class="flex items-center gap-3">
                        <button type="button" class="text-gray-400 hover:text-blue-600" title="Attach file"><i class="fas fa-paperclip text-xl"></i></button>
                        <button type="button" class="text-gray-400 hover:text-blue-600" title="Emoji"><i class="far fa-smile text-xl"></i></button>
                        <input type="text" x-model="newMessage" placeholder="Type a message..." class="flex-1 px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button type="submit" :disabled="!newMessage.trim()" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-paper-plane mr-1"></i> Send
                        </button>
                    </form>
                </div>
            </div>
        </template>

    </div>

</div>

<script>
    function chatApp() {
        return {
            search: '',
            tab: 'contacts',
            selected: null,
            newMessage: '',
            typing: false,
            messages: [],
            contacts: [
                { id: 1, name: 'John Doe', initials: 'JD', color: 'bg-blue-600', online: true, time: '10:32 AM', lastMsg: 'Sure, I\'ll send over the documents shortly.', unread: 2 },
                { id: 2, name: 'Jane Smith', initials: 'JS', color: 'bg-green-600', online: true, time: '9:15 AM', lastMsg: 'Great meeting yesterday! Let\'s follow up next week.', unread: 0 },
                { id: 3, name: 'Mike Johnson', initials: 'MJ', color: 'bg-purple-600', online: false, time: 'Yesterday', lastMsg: 'When can we schedule the demo?', unread: 1 },
                { id: 4, name: 'Sarah Wilson', initials: 'SW', color: 'bg-yellow-600', online: false, time: 'Yesterday', lastMsg: 'Thanks for the update.', unread: 0 },
                { id: 5, name: 'Alice Liu', initials: 'AL', color: 'bg-pink-600', online: true, time: '11:00 AM', lastMsg: 'The proposal looks good!', unread: 3 },
                { id: 6, name: 'Robert Brown', initials: 'RB', color: 'bg-red-600', online: false, time: '2 days ago', lastMsg: 'Looking forward to the proposal.', unread: 0 },
            ],

            get filteredContacts() {
                if (!this.search.trim()) return this.contacts;
                const q = this.search.toLowerCase();
                return this.contacts.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    c.lastMsg.toLowerCase().includes(q)
                );
            },

            selectContact(contact) {
                this.selected = contact;
                contact.unread = 0;
                this.messages = [
                    { text: 'Hi there! I wanted to follow up on the proposal we discussed last week.', time: '10:15 AM', sent: false, read: true },
                    { text: 'Hey John! Yes, I\'ve reviewed it. Looks great overall. Just had a couple of questions about the timeline.', time: '10:18 AM', sent: true, read: true },
                    { text: 'Sure, happy to clarify. What\'s on your mind?', time: '10:22 AM', sent: false, read: true },
                    { text: 'We\'re aiming for a Q3 rollout. Can the development phase be completed by June?', time: '10:25 AM', sent: true, read: true },
                    { text: 'Absolutely. We can allocate additional resources if needed. I\'ll send over an updated timeline by EOD.', time: '10:28 AM', sent: false, read: true },
                    { text: 'Perfect, that sounds great. Thanks John!', time: '10:30 AM', sent: true, read: true },
                    { text: 'Sure, I\'ll send over the documents shortly.', time: '10:32 AM', sent: false, read: false },
                ];
                this.$nextTick(() => this.scrollToBottom());
            },

            sendMessage() {
                if (!this.newMessage.trim()) return;
                const now = new Date();
                const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                this.messages.push({ text: this.newMessage, time, sent: true, read: false });
                this.newMessage = '';
                this.$nextTick(() => this.scrollToBottom());

                // Simulate typing + reply (HTTP polling would handle this in real app)
                this.typing = true;
                setTimeout(() => {
                    this.typing = false;
                    const replyTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    this.messages.push({ text: 'Got it! I\'ll review and get back to you shortly.', time: replyTime, sent: false, read: true });
                    this.$nextTick(() => this.scrollToBottom());
                }, 2000);
            },

            scrollToBottom() {
                const el = this.$refs.messagesContainer;
                if (el) el.scrollTop = el.scrollHeight;
            }
        };
    }
</script>

</body>
</html>
